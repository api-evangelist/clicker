name: Clicker
description: Clicker is a consumer-facing streaming guide and discovery platform that helps people find
  where to watch popular and new movies and TV shows across streaming providers, aggregating title
  availability from services such as Netflix, Hulu, Disney+, Max, Amazon Prime Video, Apple TV+,
  Paramount+, Peacock, Starz, BET+, Philo, and FuboTV into a single searchable catalog. The product is
  a web application (Next.js) organized around TV Shows and Movies browse and search experiences.
  Clicker is backed by Redpoint Ventures. As of this enrichment pass Clicker publishes no public API,
  developer portal, SDKs, or developer documentation; its only backend surface is a private, robots
  disallowed internal application API.
